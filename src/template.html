<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Battleship</title>
    </head>
    
    <body>
        <header>
            <div class="header-container">
                <div class="header-left">
                    <svg class="battleship-logo" width="800px" height="800px" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
                        <path stroke="#b1e2f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 16 2-4-4-.889M12 10v5m0-5-5 1.111M12 10l5 1.111M5 16l-2-4 4-.889m0 0L6 6h4m7 5.111L18 6h-4m0 0V3h-4v3m4 0h-4M3 20l1.245-.498a2.57 2.57 0 0 1 2.38.248v0a2.57 2.57 0 0 0 3.36-.446l.035-.04a2.631 2.631 0 0 1 3.96 0l.036.04a2.57 2.57 0 0 0 3.36.446v0a2.57 2.57 0 0 1 2.38-.248L21 20"/>
                    </svg>
                    <h1>Battleship</h1>
                </div>
                <div class="header-right">
                    <a href="https://github.com/KyleCheng20" target="_blank">
                        <svg class="github-logo" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
                            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <main>
            <div class="turn-bar-container">
                <div class="player1-turn-indicator">
                    <span class="turn-text"></span>
                </div>
                <div class="player2-turn-indicator">
                    <span class="turn-text"></span>
                </div>
            </div>

            <div class="content-container">
                <span class="status-text"></span>
                <div class="board-container">
                    <div class="player1-board-container">
                        <h2>Your Board</h2>
                        <div class="board-container-left">
                            <div class="ships-btn-container">
                                <div class="player1-ship-container"></div>
                                <div class="util-btns-container">
                                    <button type="button" class="randomize-ships-btn">Randomize</button>
                                    <button type="button" class="rotate-ships-btn">Rotate Ship (R key)</button>
                                    <button type="button" class="reset-board-btn">Reset</button>
                                </div>
                            </div>
                            <div class="player1-board"></div>
                        </div>
                    </div>
                    <h3>VS</h3>
                    <div class="player2-board-container">
                        <h2>Enemy Board</h2>
                        <div class="board-container-right">
                            <div class="player2-board"></div>
                            <div class="player2-ship-container"></div>
                        </div>
                    </div>
                </div>
                <button type="button" class="start-game-btn">Start Game</button>
            </div>
        </main>

        <dialog class="difficulty-selector-modal">
            <h2>Select CPU Difficulty</h2>
            <div class="difficulty-btns-container">
                <button type="button" class="difficulty-btn" data-difficulty="normal">Normal</button>
                <button type="button" class="difficulty-btn" data-difficulty="hard">Hard</button>
            </div>
        </dialog>

        <dialog class="game-over-modal">
            <div class="game-over-container">
                <h2>Game Over</h2>
                <p class="winner-text"></p>
                <button type="button" class="play-again-btn">Play again</button>
            </div>
        </dialog>

        <footer>
            <div class="footer-inner">
                    <p>© 2026 <a href="https://github.com/KyleCheng20" target="_blank">Kyle Cheng</a></p>
                </div>
        </footer>
    </body>
</html>
